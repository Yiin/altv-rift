- "Diego sent you, huh? Looks like I've become the welcoming committee for new blood,"
- "Here's the thing, mining isn't a walk in the park. This ain't about playing in the dirt. It's grimy, it's sweaty, and it's a hell lot of hard work. You have to work and bleed, sometimes literally, to reap any reward."
- "But we won't be starting with the pickaxe. No, that's a lesson for another day. We're starting simple."
- "Sand. You think it'd be easy, right? But like everything else, it takes technique, precision, patience."
- "Get me 30 bags. We need filled sandbags for barricades, but most importantly, it's good for getting started. Believe it or not, moving sand from here to there can make all the difference."
