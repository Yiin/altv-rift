- from: player
  message: "Where am I? What happened?"
- from: sam
  message: "Hey there, don't worry, you're safe now. We found you unconscious and brought you to our camp. My name is Sam."
- from: player
  message: "I can't recall anything. And who are all these people?"
- from: sam
  message: "It's alright, memory loss is common in our situation. We're all survivors of this virus outbreak that wiped out a large portion of the population. Lucky for us, we're immune."
- from: player
  message:
    - "Immune, huh? Well, that's a small consolation, I guess. So, what's next?"
    - "How did you find me? Were there other survivors nearby?"
- from: sam
  message:
    - "We'll help you get back on your feet. First things first, we need to get you some proper clothing. Let me introduce you to Jane, our camp's tailor."
    - "We were out scouting for supplies and survivors when we found you. There might be others out there, but we haven't come across them yet. Right now, we should focus on getting you settled in. Let's start by getting you some proper clothing. Meet Jane, our camp's tailor."
- from: sam
  message: "Jane, our friend here needs some attire to start their new life. Can you help them out?"
- from: jane
  message: "Of course, Sam! Hi there, I'm Jane. It's always nice to see a new face around here. Let's get you looking sharp! I have various clothing items you can mix and match to create your own unique outfit."
- from: player
  message:
    - "Finally, some fashion choices in this post-apocalyptic world! Show me what you have."
    - "Great! Do you have any recommendations for a stylish yet functional outfit?"
- from: jane
  message:
    - "(Laughs) You've got a sense of humor, I like that. Alright, here are some clothing items you can choose from. Mix and match to your heart's content!"
    - "Of course! You can never go wrong with a comfortable shirt, sturdy pants, and a pair of boots that can handle rough terrain. Feel free to browse through our selection and pick what you like."
  action: SELECT_STARTING_OUTFIT
- from: player
  message: "Thanks, Jane. I'm all set now."
- from: jane
  message: "You're welcome! Remember, looking good is part of feeling good. Stay safe out there!"
- from: sam
  message: "Now that you're dressed for the occasion, it's time to learn about the different jobs and activities you can engage in. Tom here is our go-to guy for that. Tom, can you give our friend a rundown?"
- from: tom
  message: "Absolutely, Sam. Hi there, I'm Tom. I'll be your guide to the various jobs and activities available to you in Story of Cities. First, let me go over the part-time jobs: woodcutting, mining, fishing, and farming. These activities can help you earn some cash and resources. Then there are the main jobs: medic, police officer, mechanic, and transporter. These jobs are more specialized and can provide you with unique skills and benefits."
- from: player
  message:
    - "Can you tell me more about the part-time jobs?"
    - "I'm interested in learning more about the main jobs."
- from: tom
  message:
    - "Sure! Part-time jobs are a great way to earn some money and gather materials. Woodcutting and mining can provide you with resources for crafting, while fishing and farming can help keep you and your fellow survivors fed. You can always switch between these activities as you please."
    - "Main jobs are more specialized and can provide unique benefits to you and your group. As a medic, you'll be able to heal others; as a police officer, you'll help maintain order and safety; as a mechanic, you'll repair and upgrade vehicles; and as a transporter, you'll deliver goods and people safely across the city. Choose a job that best suits your interests and playstyle."
- from: player
  message: "Makes sense. What's next?"
- from: tom
  message: "Great choice! Now, let's talk about crafting. In Story of Cities, you can create useful items and equipment from the materials you gather during your job activities. Crafting is essential for survival, and as you progress, you'll be able to create more advanced items."
- from: player
  message:
    - "Sounds interesting. How do I get started with crafting?"
    - "What kind of items can I craft?"
- from: tom
  message:
    - "To start crafting, you'll need a basic set of tools and a crafting station, which can be found in our camp. Simply gather the necessary materials, approach the crafting station, and follow the instructions to create your desired item. As you gain experience, you'll be able to craft more advanced items."
    - "The possibilities are vast! You can craft weapons, armor, tools, consumables, and even vehicle upgrades. As you progress and gain experience, your crafting abilities will improve, allowing you to create more advanced and powerful items."
- from: tom
  message: "To help you get started, I'd like you to craft a simple tool or piece of equipment. Here are the materials you'll need. Give it a try, and let me know if you have any questions."
  action: START_CRAFTING_TUTORIAL
- from: player
  message: "I've crafted the item. What now?"
- from: tom
  message: "Well done! Keep practicing your crafting skills, and you'll become more efficient and creative over time. Remember, knowledge is power, and in our world, it's also the key to survival."
- from: sam
  message: "I think you're quite ready to face the challenges ahead. But before you go, here's some starting cash and a guide book to help you get started."
  action: RECEIVE_TUTORIAL_REWARD
- from: player
  message: "Thanks, Sam. I appreciate the help."
- from: sam
  message: "You're welcome! As you explore the world, don't forget to interact with other survivors, join or form groups, and participate in territory wars. It's important to work together in this new world."
- from: player
  message:
    - "Got it. I'll be sure to keep an eye out for other players and form alliances."
    - "Sounds like an adventure. I can't wait to meet new people and face challenges together."
- from: sam
  message:
    - "That's the spirit! And always remember to stay vigilant against the Cult groups and Underground Syndicates that threaten our survival."
    - "I'm sure you'll do great! Just remember to stay vigilant against the Cult groups and Underground Syndicates that threaten our survival."
- from: player
  message: "I'll keep that in mind. Thanks for everything, and I'll see you around."
- from: sam
  message: "Take care, and good luck out there!"
