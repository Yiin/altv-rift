services:
  server:
    deploy:
      resources:
        limits:
          memory: 8G
    image: "${IMAGE_NAME}:latest"
    build:
      context: .
      dockerfile: ./Dockerfile.prod
      labels:
        runnumber: "${GITHUB_RUN_ID}"
      args:
        - DATABASE_URL=${DATABASE_URL}
        - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
        - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
        - REDIRECT_IP=${REDIRECT_IP}
        - SERVER_ENV=${SERVER_ENV}
        - ALTV_HOST=${ALTV_HOST}
        - ALTV_NAME=${ALTV_NAME}
        - ALTV_PORT=${ALTV_PORT}
        - ALTV_PASSWORD=${ALTV_PASSWORD}
        - ALTV_ANNOUNCE=${ALTV_ANNOUNCE}
        - ALTV_DEBUG=${ALTV_DEBUG}
        - ALTV_MODULES=${ALTV_MODULES}
        - ALTV_RESOURCES=${ALTV_RESOURCES}
        - ALTV_TOKEN=${ALTV_TOKEN}
        - VITE_CDN_URL=${VITE_CDN_URL}
        - S3_ACCESS_KEY=${S3_ACCESS_KEY}
        - S3_REGION=${S3_REGION}
        - S3_HOST_BASE=${S3_HOST_BASE}
        - S3_HOST_BUCKET=${S3_HOST_BUCKET}
        - S3_SECRET_KEY=${S3_SECRET_KEY}
        - S3_WEBSITE_ENDPOINT=${S3_WEBSITE_ENDPOINT}
    restart: unless-stopped
    stdin_open: true
    ports:
      - "7788:7788"
      - "7788:7788/udp"
      - "7790:7790" # discord login
