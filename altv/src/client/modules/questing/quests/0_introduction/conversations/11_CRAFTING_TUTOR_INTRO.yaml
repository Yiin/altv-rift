- "Diego sent you, huh? Well, don't just stand there like a rusty nail. Look like you've got some grit about ya, maybe you won't be as useless as the last lot."
- "Alright, apprentice, pay attention. You're here for crafting. Gotta keep our minds working, or we'll go as mad as a hatter, right?"
- "First order of business. Storage bags. Can never have too many of them around here. We're always short on space, and these bags keep our things sorted. Fifty bags, that's your task. It ain't rocket science."
- "And don't cut any corners with those seams. I don't want 'em ripping when they're loaded up and causing a bloody mess. Got that? Good...now scoot."
