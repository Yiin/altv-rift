- "Uh-huh, you awake? Barely surviving that landing is a miracle on its own."
- "By the looks of it, you're new here. Cal Burnett's the name. Used to be a military officer, now just trying to keep a semblance of order in this godforsaken place."
- "Now, about this place... we're at Cayo Perico. Once a symbol of luxury, now a harbinger of chaos. Like San Andreas, we've had our share of vanishing folks here too."
- "Plane landings like the one you just survived? Happens more often than we'd like. Will take a while until situation calms down, if ever."
- "You're part of the surviving crew now. Count your blessings, but don't get comfy. This ain't a resort, it's a fight for survival."
- "What happened to the rest of the world, you may ask? I wish I knew, pal. We've got radio but the broadcasts have been damn flakey. For now, we've got our hands full dealing with our own mess here."
- "So, get yourself together. Here, take this.  Trust me, that tin can airplane did you no favors. There are bandages, antiseptics, what-have-you. Get yourself sorted, we can talk more after."
