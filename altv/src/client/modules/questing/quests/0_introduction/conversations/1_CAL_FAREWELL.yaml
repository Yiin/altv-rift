- "Listen, kid. I don't have much time to hold your hand through it all. We are all pulling our weight around here, and you got to earn your keep as well. I've sorted the airstrip, but the folks need more help."
- "Look for Diego in the village, reliable fella. Spanish descent, been a cop in his previous life. Short, athletic, always in that old police uniform — says it reminds him of better times. Ain't much for smiling, but his heart's in the right place."
- "Takes care of assigning responsibilities, making sure we all got food in our bellies, roof over our heads. He's strict, but fair. Talk to him, he'll give you something to do."
- "Tell him Cal sent you - it might just make his grumpy ass a bit more pleasant."
- "There, follow that. Now, go on - time's something we can't afford to waste."
