name: CI/CD Pipeline

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: altv-rift-server
#
jobs:
  build:
    runs-on: self-hosted
    permissions:
      packages: write
      contents: read
      #
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          REDIRECT_IP: ${{ vars.REDIRECT_IP }}
          SERVER_ENV: ${{ vars.SERVER_ENV }}
          ALTV_HOST: ${{ vars.ALTV_HOST }}
          ALTV_NAME: ${{ vars.ALTV_NAME }}
          ALTV_PORT: ${{ vars.ALTV_PORT }}
          ALTV_PASSWORD: ${{ vars.ALTV_PASSWORD }}
          ALTV_ANNOUNCE: ${{ vars.ALTV_ANNOUNCE }}
          ALTV_DEBUG: ${{ vars.ALTV_DEBUG }}
          ALTV_MODULES: ${{ vars.ALTV_MODULES }}
          ALTV_RESOURCES: ${{ vars.ALTV_RESOURCES }}
          VITE_CDN_URL: ${{ vars.VITE_CDN_URL }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_HOST_BASE: ${{ vars.S3_HOST_BASE }}
          S3_HOST_BUCKET: ${{ vars.S3_HOST_BUCKET }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_WEBSITE_ENDPOINT: ${{ vars.S3_WEBSITE_ENDPOINT }}
        run: COMPOSE_PROJECT_NAME=${IMAGE_NAME} docker compose -f docker-compose.prod.yaml build

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: "${{ github.repository_owner }}"

      - name: Push image
        run: |
          echo "Image name: ${IMAGE_NAME}"
          echo "Full image tag: ghcr.io/${OWNER_LC}/${IMAGE_NAME}:latest"
          docker tag ${IMAGE_NAME}:latest ghcr.io/${OWNER_LC}/${IMAGE_NAME}:latest
          docker push ghcr.io/${OWNER_LC}/${IMAGE_NAME}:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: SSH to Server and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/yiin/altv-rift-server:latest
            curl http://altv.rift.lt:7790/cleanup/${{ secrets.DISCORD_CLIENT_SECRET }} > /dev/null 2>&1 &
            sleep 1
            docker stop altv-server || true
            docker rm altv-server || true
            docker run -d --name altv-server \
              -p 7788:7788 \
              -p 7788:7788/udp \
              -p 7790:7790 \
              -p 7799:7799/udp \
              ghcr.io/yiin/altv-rift-server:latest
            docker image prune -f
