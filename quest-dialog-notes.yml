client:
  if npc.talkable
    call-server: get-next-dialogue (npc id?)
    get dialog entry: display dialog
    on continue
    call-server: get-next-dialogue (npc id?, prevIndex)
    get-next-dialogue

server:
  on get-next-dialogue(prevIndex?)
    return dialog entry on prevIndex + 1

dialogue-request:
| { npcId: number }
| { npcId: number, index: number, option?: number }

dialogue-response:
| { npcId: number; message: string, next: number }
| { message: string | string[], next: number }
